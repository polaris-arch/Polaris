name: Windows Source Diagnostic Only

on:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  source_diagnostic:
    runs-on: windows-2022
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 5924c16d34af0c416ebf2088ef7524d35f15b4a5
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version: '1.25.5'
          cache: false
      - name: Diagnose strict pinned source replay on native Windows
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          python - <<'PY'
          import hashlib, importlib.util, json, shutil, subprocess, sys, tempfile
          from pathlib import Path
          app = Path.cwd()
          candidate = '5924c16d34af0c416ebf2088ef7524d35f15b4a5'
          def command(args, cwd=None):
              result = subprocess.run(args, cwd=cwd, check=True, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
              return result.stdout.decode('utf-8', 'backslashreplace').strip()
          assert command(['git', 'rev-parse', 'HEAD']) == candidate
          assert command(['git', 'status', '--porcelain', '--untracked-files=no']) == ''
          provider_path = app / 'scripts/core-source-provision.py'
          assert hashlib.sha256(provider_path.read_bytes()).hexdigest() == 'b19f1568d6033e505dc7bd3f09918ac4e0d0f83435a204c2e58644d6d1efa44e'
          manifest_path = app / 'scripts/libbox-patches/source-manifest.json'
          assert hashlib.sha256(manifest_path.read_bytes()).hexdigest() == '1570f165723b9763fc23b1e5870f4e5b4a02b45f562542ce9d75b67a5637512a'
          manifest = json.loads(manifest_path.read_bytes())
          assert manifest['sourceCommit'] == 'b609f959f57ce34416c51c7b87ce4a76f2e1df56'
          assert [(item['module'], item['upstreamCommit']) for item in manifest['dependencyPatches']] == [
              ('github.com/sagernet/sing-tun', '3077c705bbdb0c86f316a15d75f04766a022c84d'),
              ('github.com/sagernet/nftables', '55b467739faeff10b431fbc060cba7c5222c85cf')]
          for item in manifest['patches'] + manifest['dependencyPatches']:
              filename, expected = (item['file'], item['sha256']) if 'file' in item else (item['patchFile'], item['patchSha256'])
              assert hashlib.sha256((manifest_path.parent / filename).read_bytes()).hexdigest() == expected
          spec = importlib.util.spec_from_file_location('source_diagnostic', provider_path)
          provider = importlib.util.module_from_spec(spec)
          spec.loader.exec_module(provider)
          base = Path(tempfile.mkdtemp(prefix='polaris-win-source-diagnostic-'))
          checkout = base / 'checkout'
          original_run = provider.run
          allowed_git = {'rev-parse', 'clone', 'config', 'checkout', 'apply', 'add', 'write-tree', 'archive', 'fetch', 'read-tree', 'update-index'}
          go = Path(shutil.which('go'))
          assert 'go version go1.25.5 windows/amd64' == command([str(go), 'version'])
          print(json.dumps({'candidate': candidate, 'providerSha256': hashlib.sha256(provider_path.read_bytes()).hexdigest(), 'gitVersion': command(['git', '--version']), 'goMetadataVersion': command([str(go), 'version']), 'python': sys.version, 'freshCheckout': str(checkout)}), flush=True)
          def snapshot():
              if not (checkout / '.git').is_dir():
                  print('no checkout Git index exists', flush=True)
                  return
              queries = [
                  ['git', 'config', '--show-origin', '--get-regexp', r'^core\.(filemode|autocrlf|symlinks)$'],
                  ['git', 'diff', '--raw'],
                  ['git', 'diff-files', '--raw'],
                  ['git', 'diff-files', '--name-only', '-z'],
              ]
              changed = []
              for args in queries:
                  result = subprocess.run(args, cwd=checkout, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                  print(json.dumps({'readOnlyDiagnostic': args, 'exitCode': result.returncode, 'stdout': result.stdout.decode('utf-8', 'backslashreplace'), 'stderr': result.stderr.decode('utf-8', 'backslashreplace')}), flush=True)
                  if args[-1] == '-z' and result.returncode == 0:
                      changed = [name.decode('utf-8') for name in result.stdout.split(b'\0') if name]
              for name in changed:
                  path = checkout / name
                  print(json.dumps({'changedPath': name, 'exists': path.exists(), 'statMode': oct(path.stat().st_mode) if path.exists() else None, 'rawSha256': hashlib.sha256(path.read_bytes()).hexdigest() if path.is_file() else None}), flush=True)
                  for args in [['git', 'ls-files', '--stage', '--', name], ['git', 'ls-files', '--debug', '--', name], ['git', 'hash-object', '--no-filters', '--', name], ['git', 'hash-object', '--', name]]:
                      result = subprocess.run(args, cwd=checkout, stdout=subprocess.PIPE, stderr=subprocess.PIPE)
                      print(json.dumps({'readOnlyDiagnostic': args, 'exitCode': result.returncode, 'stdout': result.stdout.decode('utf-8', 'backslashreplace'), 'stderr': result.stderr.decode('utf-8', 'backslashreplace')}), flush=True)
          def observed_run(args, **kwargs):
              if args[0] == str(go):
                  assert args[1:] == ['version'] or args[1:3] == ['mod', 'edit'] or args[1:4] == ['list', '-m', '-json'], 'only locked Go metadata commands allowed'
              else:
                  assert args[0] == 'git'
                  verb = args[3] if args[1] == '-C' else args[1]
                  assert verb in allowed_git, args
              print(json.dumps({'providerCommand': args, 'cwd': str(kwargs.get('cwd', app))}), flush=True)
              try:
                  return original_run(args, **kwargs)
              except subprocess.CalledProcessError as error:
                  print(json.dumps({'failedCommand': error.cmd, 'exitCode': error.returncode, 'stdout': (error.stdout or b'').decode('utf-8', 'backslashreplace'), 'stderr': (error.stderr or b'').decode('utf-8', 'backslashreplace')}), flush=True)
                  snapshot()
                  raise
          provider.run = observed_run
          def fetch(url, commit, name):
              path = base / name
              path.mkdir()
              command(['git', 'init', '--quiet', str(path)])
              command(['git', '-C', str(path), 'fetch', '--no-tags', '--depth=1', url, commit + ':refs/heads/polaris-source'])
              assert command(['git', '-C', str(path), 'rev-parse', 'refs/heads/polaris-source']) == commit
              return path
          source = fetch('https://github.com/SagerNet/sing-box.git', manifest['sourceCommit'], 'upstream')
          repositories = {item['module']: fetch(item['sourceURL'], item['upstreamCommit'], 'upstream-' + item['name']) for item in manifest['dependencyPatches']}
          provider.provision(manifest_path, source, checkout, repositories, go)
          print('strict source provider metadata completed; no build/test/core execution performed', flush=True)
          PY
