name: Desktop Core Sources

# Ordinary callers build four native cores. Explicit technical validation builds
# Windows and retrieves three reviewed origins without rewriting their receipts.
# Every consumer still verifies all four actual binaries before use.
on:
  workflow_call:
    inputs:
      candidate:
        type: string
        required: true
      native_validation:
        type: boolean
        required: false
        default: false
    outputs:
      candidate:
        value: ${{ inputs.candidate }}
      artifact_name:
        value: ${{ jobs.assemble.outputs.artifact_name }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CORE_CANDIDATE: ${{ inputs.candidate }}
  CORE_RUN_ID: ${{ github.run_id }}
  CORE_RUN_ATTEMPT: ${{ github.run_attempt }}
  POLARIS_NATIVE_PAYLOAD_VALIDATION: ${{ inputs.native_validation && '1' || '0' }}

jobs:
  produce:
    name: native core (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # Ordinary runs retain four producers. The reviewed validation mode
        # rebuilds Windows only; the assembler fetches three exact fixed origins.
        include: ${{ fromJSON(inputs.native_validation && '[{"platform":"win","os":"windows-2022","host":"win32","arch":"x64"}]' || '[{"platform":"linux","os":"ubuntu-22.04","host":"linux","arch":"x64"},{"platform":"win","os":"windows-2022","host":"win32","arch":"x64"},{"platform":"mac-x64","os":"macos-15-intel","host":"darwin","arch":"x64"},{"platform":"mac-arm64","os":"macos-15","host":"darwin","arch":"arm64"}]') }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Verify exact candidate and native compiler host
        env:
          CORE_HOST: ${{ matrix.host }}
          CORE_ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          [[ "$CORE_CANDIDATE" =~ ^[a-f0-9]{40}$ ]]
          [ "$(git rev-parse HEAD)" = "$CORE_CANDIDATE" ]
          [ -z "$(git status --porcelain --untracked-files=no)" ]
          if [ "$POLARIS_NATIVE_PAYLOAD_VALIDATION" = 1 ]; then
            node --input-type=module -e 'import {validationContext} from "./scripts/desktop-core/validation-origin.mjs"; validationContext(process.env.CORE_CANDIDATE)'
          fi
          node -e 'if (process.platform !== process.env.CORE_HOST || process.arch !== process.env.CORE_ARCH) throw Error("native producer host differs")'

      - name: Read pinned source Go version
        id: go-pin
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; import { desktopSourceGoVersion } from "./scripts/desktop-core/source-graph.mjs"; console.log("version=" + desktopSourceGoVersion(process.cwd(), JSON.parse(readFileSync("src-tauri/core-manifest.json", "utf8"))))' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-pin.outputs.version }}
          cache: false

      - name: Verify native macOS SDK and compiler
        if: runner.os == 'macOS'
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          [ -d "$sdk" ]
          cc="$(xcrun --sdk macosx --find clang)"
          cxx="$(xcrun --sdk macosx --find clang++)"
          [ -x "$cc" ] && [ -x "$cxx" ]
          xcrun --sdk macosx --show-sdk-version
          "$cc" --version
          {
            echo "SDKROOT=$sdk"
            echo "CC=$cc"
            echo "CXX=$cxx"
          } >> "$GITHUB_ENV"

      # On Windows the unchanged producer performs native systemconfig Go unit
      # tests. Darwin CGO uses the actual SDK above; no cross-host substitute.
      - name: Produce exact platform source artifact
        env:
          CORE_PLATFORM: ${{ matrix.platform }}
          CORE_BUNDLE: ${{ runner.temp }}/desktop-core-bundle
        run: node scripts/fetch-core.mjs --producer --platform="$CORE_PLATFORM" --bundle-dir="$CORE_BUNDLE" --candidate="$CORE_CANDIDATE"

      - uses: actions/upload-artifact@v7
        with:
          name: desktop-core-producer-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.platform }}
          path: ${{ runner.temp }}/desktop-core-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  assemble:
    name: verify four source artifacts
    needs: produce
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-22.04
    outputs:
      artifact_name: ${{ steps.bundle.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Read pinned source Go version
        id: go-pin
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; import { desktopSourceGoVersion } from "./scripts/desktop-core/source-graph.mjs"; console.log("version=" + desktopSourceGoVersion(process.cwd(), JSON.parse(readFileSync("src-tauri/core-manifest.json", "utf8"))))' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.go-pin.outputs.version }}
          cache: false

      # Default download scope is this workflow run, including reusable jobs.
      # Ordinary downloads have no previous-run fallback. The separate validation
      # downloader below accepts only committed exact origin IDs/ZIP/receipt pins.
      - name: Download Linux source artifact from this attempt
        if: inputs.native_validation != true
        uses: actions/download-artifact@v8
        with:
          name: desktop-core-producer-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}-linux
          path: ${{ runner.temp }}/desktop-core-bundle

      - name: Download Windows source artifact from this attempt
        uses: actions/download-artifact@v8
        with:
          name: desktop-core-producer-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}-win
          path: ${{ runner.temp }}/desktop-core-bundle

      - name: Download Intel macOS source artifact from this attempt
        if: inputs.native_validation != true
        uses: actions/download-artifact@v8
        with:
          name: desktop-core-producer-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-x64
          path: ${{ runner.temp }}/desktop-core-bundle

      - name: Download arm64 macOS source artifact from this attempt
        if: inputs.native_validation != true
        uses: actions/download-artifact@v8
        with:
          name: desktop-core-producer-${{ inputs.candidate }}-${{ github.run_id }}-${{ github.run_attempt }}-mac-arm64
          path: ${{ runner.temp }}/desktop-core-bundle

      - uses: actions/setup-python@v6
        if: inputs.native_validation == true
        with:
          python-version: '3.12'

      - name: Retrieve reviewed unchanged native origins
        if: inputs.native_validation == true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/desktop-core/validation-download.py --bundle-dir="$RUNNER_TEMP/desktop-core-bundle"

      - name: Assemble and verify exact candidate bundle
        id: bundle
        env:
          CORE_BUNDLE: ${{ runner.temp }}/desktop-core-bundle
        run: |
          set -euo pipefail
          if [ "$POLARIS_NATIVE_PAYLOAD_VALIDATION" = 1 ]; then
            node scripts/fetch-core.mjs --assemble --validation-origin --bundle-dir="$CORE_BUNDLE" --candidate="$CORE_CANDIDATE"
          else
            node scripts/fetch-core.mjs --assemble --bundle-dir="$CORE_BUNDLE" --candidate="$CORE_CANDIDATE"
          fi
          node scripts/fetch-core.mjs --bundle-dir="$CORE_BUNDLE" --candidate="$CORE_CANDIDATE"
          echo "artifact_name=desktop-core-bundle-$CORE_CANDIDATE-$CORE_RUN_ID-$CORE_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.bundle.outputs.artifact_name }}
          path: ${{ runner.temp }}/desktop-core-bundle
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
