name: Release Risk

# 合入前与 main 集成态的发布风险门：workflow 永远触发，路径分类发生在 job 内。
# 这样把最终 `release risk gate` 设为 required check 时，无关改动也会快速成功，
# 不会因 workflow 级 paths 过滤而永久 Pending。
on:
  pull_request:
    branches: [main]
  merge_group:
    types: [checks_requested]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preserve_run:
        description: 固定源码审计不被后续 tip 取消
        type: boolean
        default: false
      mode:
        type: choice
        options: [ordinary, native-payload]
        default: ordinary
        required: true
      defer_apple:
        description: '临时只验证非Apple；Apple未验证，完整风险门仍不通过，不发布产物'
        type: boolean
        default: false

permissions:
  contents: read

# 同一 PR / 同一分支上，新提交取消旧提交的在途运行（2026-10-07 复核并收口）。
#
# 🔴 此前「新一批 pending 到旧一批结束」的成因**不在本段**：本段早就对 PR 与 main 写了取消。
#    真正让取消落空的是 package.yml 的 package job 用 `always()` 作状态函数 —— 取消时 GitHub 对在途
#    job 重新求值 `if`，恒真的不取消，四条打包腿（各 14–25 分钟）照跑到底，新跑在本并发组里干等。
#    已在那边改成 `!cancelled()`（实证与 run 号写在该 job 的 `if` 上方）。只改本段修不了那个现象。
#
# Automatic PR/main/ordinary dispatch tips are replaceable. Explicit fixed
# audits and merge groups use independent run IDs throughout reusable calls;
# publishing tag paths remain outside this workflow. Cancellation must reach
# nested installer/mobile jobs without bypassing their required result gates.
concurrency:
  group: release-risk-${{ github.workflow }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.ref }}${{ (inputs.preserve_run || github.event.inputs.preserve_run == 'true' || github.event_name == 'merge_group') && format('-fixed-{0}', github.run_id) || '' }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') && github.event_name != 'merge_group' && !inputs.preserve_run && github.event.inputs.preserve_run != 'true' && (github.event_name == 'pull_request' || github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}

jobs:
  pc_runtime_release_policy:
    name: Source-first release policy
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '26'
      - name: Verify fail-closed source-first release policy
        run: node --test scripts/assert-pc-runtime-release.test.mjs

  classify:
    name: classify release impact
    runs-on: ubuntu-22.04
    outputs:
      kernel: ${{ steps.impact.outputs.kernel }}
      platforms: ${{ steps.impact.outputs.platforms }}
      preflight: ${{ steps.impact.outputs.preflight }}
      has_package: ${{ steps.impact.outputs.has_package }}
      android: ${{ steps.impact.outputs.android }}
      apple: ${{ steps.impact.outputs.apple }}
      unregistered: ${{ steps.impact.outputs.unregistered }}
      candidate: ${{ github.event.pull_request.head.sha || github.sha }}
      native_validation: ${{ github.event_name == 'workflow_dispatch' && inputs.mode == 'native-payload' && 'true' || 'false' }}
    steps:
      - name: Validate manual Apple deferral scope
        if: github.event_name == 'workflow_dispatch' && inputs.defer_apple
        shell: bash
        env:
          VALIDATION_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          # Reuse the existing no-upload/light-build and tag-only publication
          # guards below. Deferral cannot enter a tag publication DAG.
          case "$VALIDATION_REF" in
            refs/heads/?*) ;;
            *) echo '::error::Apple deferral is validation-only on an explicit branch'; exit 1 ;;
          esac
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Install SquashFS fixture tools
        run: |
          sudo apt-get update
          sudo apt-get install -y squashfs-tools

      - name: Test release impact classifier
        # 走 gate-node-test.sh 而不是直接 `node --test`：后者指向空目录/文件被移走/错误
        # cwd 时是 rc=0 静默判绿（scripts/gate-node-test.sh 顶部注释有实测）；本机全量门单
        # （vault SoT §12.3c）调用的是同一份脚本，两处判据共用一份实现，不各自漂移。
        run: bash scripts/gate-node-test.sh

      - name: Classify changed paths
        id: impact
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          MERGE_BASE: ${{ github.event.merge_group.base_sha }}
          MERGE_HEAD: ${{ github.event.merge_group.head_sha }}
          PUSH_BASE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
          DISPATCH_REF: ${{ github.ref }}
          DISPATCH_SHA: ${{ github.sha }}
          POLARIS_NATIVE_PAYLOAD_VALIDATION: ${{ inputs.mode == 'native-payload' && '1' || '0' }}
        run: |
          set -euo pipefail
          # Technical payload mode is explicit, branch-only and never publishing.
          if [ "$POLARIS_NATIVE_PAYLOAD_VALIDATION" = 1 ]; then
            node --input-type=module -e 'import {validationContext} from "./scripts/desktop-core/validation-origin.mjs"; validationContext(process.env.DISPATCH_SHA)'
            {
              echo 'kernel=false'
              echo 'platforms=[]'
              echo 'preflight=false'
              echo 'has_package=false'
              echo 'android=false'
              echo 'apple=false'
              echo 'unregistered='
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          base=''
          head=''
          case "$EVENT_NAME" in
            pull_request) base="$PR_BASE"; head="$PR_HEAD" ;;
            merge_group) base="$MERGE_BASE"; head="$MERGE_HEAD" ;;
            push) base="$PUSH_BASE"; head="$PUSH_HEAD" ;;
            workflow_dispatch)
              # 非分支 ref 当场红：tag 若全量分类，后续 Package 可能走到发布 job。
              [[ "$DISPATCH_REF" == refs/heads/* ]] || {
                echo "::error::手动发布风险门只接受 branch ref：$DISPATCH_REF"; exit 1; }
              # 刷新 main 后用共同祖先比较分支增量；ref 不存在、head 漂移、
              # fetch/merge-base 失败均落入下面的全量门。
              if git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main \
                && dispatch_head=$(git rev-parse --verify "${DISPATCH_REF}^{commit}" 2>/dev/null) \
                && [ "$dispatch_head" = "$DISPATCH_SHA" ] \
                && base=$(git merge-base refs/remotes/origin/main "$dispatch_head"); then
                head="$dispatch_head"
              fi ;;
            *) echo "::error::未登记的事件：$EVENT_NAME"; exit 1 ;;
          esac

          result="$RUNNER_TEMP/release-impact.json"
          apple_result="$RUNNER_TEMP/apple-impact.txt"
          if [ -n "$base" ] && [ -n "$head" ] \
            && git cat-file -e "${base}^{commit}" 2>/dev/null \
            && git cat-file -e "${head}^{commit}" 2>/dev/null; then
            git diff --name-only -z "$base" "$head" | node scripts/classify-ci-impact.mjs > "$result"
            git diff --name-only -z "$base" "$head" | node scripts/apple-ci-impact.mjs > "$apple_result"
          else
            echo "无法取得可靠 diff，故障关闭为内核门 + 四平台。"
            node scripts/classify-ci-impact.mjs --full > "$result"
            node scripts/apple-ci-impact.mjs --full < /dev/null > "$apple_result"
          fi

          jq . "$result"
          {
            echo "kernel=$(jq -r '.kernel' "$result")"
            echo "platforms=$(jq -c '.platforms' "$result")"
            echo "preflight=$(jq -r '.preflight' "$result")"
            echo "has_package=$(jq -r '.hasPackage' "$result")"
            echo "android=$(jq -r '.android' "$result")"
            echo "apple=$(cat "$apple_result")"
            echo "unregistered=$(jq -r '.unregisteredScopes | join(" ")' "$result")"
          } >> "$GITHUB_OUTPUT"

  desktop_core:
    name: four native source producers
    needs: classify
    if: needs.classify.outputs.preflight == 'true' || needs.classify.outputs.native_validation == 'true'
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/desktop-core.yml
    with:
      preserve_run: ${{ inputs.preserve_run || github.event.inputs.preserve_run == 'true' }}
      candidate: ${{ needs.classify.outputs.candidate }}
      native_validation: ${{ needs.classify.outputs.native_validation == 'true' }}

  native_payload:
    name: reviewed Linux Windows native final payload
    needs: [classify, desktop_core]
    if: needs.classify.outputs.native_validation == 'true'
    permissions:
      contents: write # reusable publishing DAG declaration; branch guard keeps it unreachable
      actions: read # ceiling for nested desktop-core assembler; no new write grant
    uses: ./.github/workflows/package.yml
    with:
      preserve_run: ${{ inputs.preserve_run || github.event.inputs.preserve_run == 'true' }}
      platforms: '["linux","windows"]'
      skip_quality_gates: true
      run_kernel_gates: true
      upload_artifacts: true
      light_build: false
      native_validation: true
      core_candidate: ${{ needs.classify.outputs.candidate }}
      core_bundle_artifact: ${{ needs.desktop_core.outputs.artifact_name }}
    secrets: inherit

  preflight:
    name: static packaging + bundled core gate
    needs: [classify, desktop_core]
    if: needs.classify.outputs.preflight == 'true'
    runs-on: ubuntu-22.04
    timeout-minutes: 120
    outputs:
      core_wire_input_artifact: ${{ steps.wire-inputs.outputs.artifact_name }}
      core_wire_input_artifact_id: ${{ steps.wire-upload.outputs.artifact-id }}
      core_wire_input_artifact_digest: ${{ steps.wire-upload.outputs.artifact-digest }}
    steps:
      - name: Set absolute release-consumer job deadline
        shell: bash
        run: node -e 'require("node:fs").appendFileSync(process.env.GITHUB_ENV, "POLARIS_RELEASE_JOB_DEADLINE_MS=" + (Date.now() + 119 * 60000) + "\n")'

      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.classify.outputs.candidate }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: '26'

      - name: Read pinned source Go version
        id: core-go
        shell: bash
        run: node --input-type=module -e 'import { readFileSync } from "node:fs"; import { desktopSourceGoVersion } from "./scripts/desktop-core/source-graph.mjs"; console.log("version=" + desktopSourceGoVersion(process.cwd(), JSON.parse(readFileSync("src-tauri/core-manifest.json", "utf8"))))' >> "$GITHUB_OUTPUT"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ steps.core-go.outputs.version }}
          cache: false

      - name: Download exact candidate core bundle
        uses: actions/download-artifact@v8
        with:
          name: ${{ needs.desktop_core.outputs.artifact_name }}
          path: ${{ runner.temp }}/desktop-core-bundle

      - name: Fetch sing-box core
        env:
          POLARIS_RELEASE_API_TOKEN: ${{ github.token }}
          CORE_CANDIDATE: ${{ needs.classify.outputs.candidate }}
          CORE_BUNDLE: ${{ runner.temp }}/desktop-core-bundle
        run: node scripts/fetch-core.mjs --bundle-dir="$CORE_BUNDLE" --candidate="$CORE_CANDIDATE"

      - name: Fetch packaging resources
        if: needs.classify.outputs.has_package == 'true'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/fetch-dashboard.mjs
          mkdir -p resources/data

      - name: Verify packaging conf invariants
        if: needs.classify.outputs.has_package == 'true'
        run: node scripts/verify-packaging.mjs confs

      - name: Install Rust stable for bundled-core gates
        if: needs.classify.outputs.kernel == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable
          rustc -Vv

      - name: Fetch pinned protoc for gRPC wire check
        if: needs.classify.outputs.kernel == 'true'
        run: node scripts/fetch-protoc.mjs

      # 只读四平台 core descriptor，不启动 sing-box；REQUIRE 仅作用于本步。
      # 判据与宿主无关，全 workflow 跑一次即可：package.yml 那侧自 2026-10-07 起也只在它的
      # `core_wire` job 里跑一次（不再每条打包腿各跑一遍）。本步保留，覆盖「命中内核但没有
      # 任何打包腿被选中」的情形，并且排在打包之前先给出归因更窄的失败。
      - name: Bundled core gRPC wire contract (all platforms)
        if: needs.classify.outputs.kernel == 'true'
        env:
          POLARIS_REQUIRE_KERNEL_GATE: '1'
        run: node scripts/desktop-core/wire-input-handoff.mjs wire --bundle-dir="$RUNNER_TEMP/preflight-wire-result.json" --candidate="${{ needs.classify.outputs.candidate }}"

      # release-risk 的真核门只在 Ubuntu 跑：只需 Linux SO；两个 go.mod 依赖仍由脚本交叉校验。
      - name: Fetch cronet library (Linux)
        if: needs.classify.outputs.kernel == 'true'
        run: node scripts/fetch-cronet.mjs --platform=linux

      - name: Run mandatory bundled-core gates
        if: needs.classify.outputs.kernel == 'true'
        env:
          POLARIS_REQUIRE_KERNEL_GATE: '1'
        shell: bash
        run: |
          set -euo pipefail
          # Metadata inspection only, distinct from the native C API/final-payload proof.
          # Retain the actual consumed core binding before the first runtime probe.
          mkdir -p native-payload-evidence
          node scripts/native-payload-input.mjs linux "$PWD/resources/linux/sing-box" "$PWD/resources/linux/libcronet.so" > native-payload-evidence/runtime-input-linux.json
          node -e 'const i=JSON.parse(require("node:fs").readFileSync("native-payload-evidence/runtime-input-linux.json")); console.log("WG_RUNTIME_CORE_INPUT="+JSON.stringify({core:i.core,sourceCommit:i.producer?.sourceCommit,sourceTree:i.producer?.sourceTree,scope:"actual metadata binding; no runtime/device acceptance"}))'
          cargo test -p polaris-config-engine --test core_dep_fingerprint
          cargo test -p polaris-config-engine --test core_schema_surface
          cargo test -p polaris-config-engine --test core_build_matrix
          cargo test -p polaris-config-engine --test kernel_accepts_outbounds
          cargo test -p polaris-config-engine --test kernel_accepts_full_config
          cargo test -p polaris-mesh --test tailscale_login_kernel_check
          cargo test -p polaris-config-engine --test network_profile_runtime
          cargo test -p polaris-config-engine --test subscription_update_guard_runtime
          cargo test -p polaris-config-engine --test mesh_inbound_runtime -- --nocapture
          cargo test -p polaris-config-engine --test managed_mesh_emission_runtime -- --nocapture
          cargo test -p polaris-net-stack --lib singbox_import::tests::local_import_round_trips_through_the_bundled_core -- --exact
          cargo test -p polaris-net-stack --lib singbox_import::tests::remote_subscription_protocol_parity_round_trips_through_the_bundled_core -- --exact
          cargo test -p polaris-net-stack --lib singbox_import::tests::remote_openvpn_static_key_mode_omits_tls_and_checks_with_core -- --exact

      # Carry checked resources within this exact candidate/run/attempt. The
      # downstream core_wire verifies the exact checked input and successful
      # wire command/tool binding, without repeating HTTP or the wire test. Other Package entry points remain independent.
      - name: Prepare current-attempt wire inputs
        id: wire-inputs
        if: needs.classify.outputs.has_package == 'true'
        shell: bash
        env:
          CORE_CANDIDATE: ${{ needs.classify.outputs.candidate }}
          WIRE_INPUTS: ${{ runner.temp }}/core-wire-inputs
          WIRE_RESULT_PATH: ${{ needs.classify.outputs.kernel == 'true' && format('{0}/preflight-wire-result.json', runner.temp) || '' }}
        run: node scripts/desktop-core/wire-input-handoff.mjs create --bundle-dir="$WIRE_INPUTS" --candidate="$CORE_CANDIDATE" --wire-result="$WIRE_RESULT_PATH"

      - name: Upload current-attempt wire inputs
        id: wire-upload
        if: steps.wire-inputs.outputs.artifact_name != ''
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wire-inputs.outputs.artifact_name }}
          path: ${{ runner.temp }}/core-wire-inputs
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  package:
    name: package selected platforms
    needs: [classify, preflight, desktop_core]
    if: needs.classify.outputs.has_package == 'true' && needs.preflight.result == 'success'
    # package.yml 内含一个仅 v* tag 才会运行的 publish job。GitHub 会在启动前校验整张复用图，
    # 即使本次 ref 不可能发布，也要求调用 job 提供它声明的 contents: write 权限上限。
    # 权限只给这一个复用 job；被调 workflow 的构建 job 仍由其顶层 permissions 收窄为 contents: read。
    permissions:
      contents: write
      actions: read
    uses: ./.github/workflows/package.yml
    with:
      preserve_run: ${{ inputs.preserve_run || github.event.inputs.preserve_run == 'true' }}
      platforms: ${{ needs.classify.outputs.platforms }}
      skip_quality_gates: true
      run_kernel_gates: false
      upload_artifacts: false
      # 轻量构型（不做 fat LTO、并行 codegen）：风险门验的是「打包链通不通、包里齐不齐」，
      # 不是发行二进制的体积。产物不是可分发物；与 `upload_artifacts: false` 必须成对出现
      # （package.yml 的 `Select installer build weight` 步对「轻量 + 上传」当场红）。
      # 风险门因此**不再验** fat LTO 链接本身，那只在 tag / 手动全量的发行构建上暴露。
      light_build: true
      core_candidate: ${{ needs.classify.outputs.candidate }}
      core_bundle_artifact: ${{ needs.desktop_core.outputs.artifact_name }}
      core_wire_input_artifact: ${{ needs.preflight.outputs.core_wire_input_artifact }}
      core_wire_input_artifact_id: ${{ needs.preflight.outputs.core_wire_input_artifact_id }}
      core_wire_input_artifact_digest: ${{ needs.preflight.outputs.core_wire_input_artifact_digest }}
    secrets: inherit

  # ══ Android release-profile 产物腿 ══
  # 与 preflight / package 并列的第三条选择性腿，判据同源（scripts/classify-ci-impact.mjs 的
  # ANDROID_IMPACT_SCOPES）。它构建一份未签名 release-profile APK，只在 runner 内守桌面三条腿
  # 结构性看不见的东西：R8 证据、资源、原生库与 16 KiB alignment。APK 不上传、不分发。
  #
  # 不与 package job 合并、也不进 package.yml 的矩阵：步骤面完全不相交，理由写在 android.yml 顶部。
  # 不给 preflight 加依赖：本腿不读随包桌面内核，preflight 的 fetch/内核门对它零信息。
  android:
    name: android release-profile gate
    needs: classify
    if: needs.classify.outputs.android == 'true'
    # 被调 workflow 的 release-apk 子 job 声明 contents: write；GitHub 在启动前校验
    # 整张复用图，即使本次 publish_release=false，也要求调用 job 给足权限上限。
    permissions:
      contents: write
    uses: ./.github/workflows/android.yml
    with:
      preserve_run: ${{ inputs.preserve_run || github.event.inputs.preserve_run == 'true' }}
      # 轻量构型（Rust 侧不做 fat LTO、并行 codegen），与上面打包腿同一开关、同一取值。本腿验的是
      # R8 证据 / 资源 / 原生库 / 16 KiB，没有一条取决于 Rust 的优化强度（逐条核对写在 android.yml
      # 的 `release_check` 头注）。不传 `publish_release`：轻量 + 发布在被调方当场红。
      # 风险门因此**不再验** Android 上的 fat LTO 链接本身，那只在 tag 的签名发布腿与手动 dispatch
      # android.yml（发行构型）上暴露。
      light_build: true

  apple:
    name: apple unsigned App and PacketTunnel gate
    needs: classify
    if: needs.classify.outputs.apple == 'true' && !(github.event_name == 'workflow_dispatch' && inputs.defer_apple)
    permissions:
      contents: read
    uses: ./.github/workflows/apple.yml
    with:
      preserve_run: ${{ inputs.preserve_run || github.event.inputs.preserve_run == 'true' }}
      candidate: ${{ needs.classify.outputs.candidate }}

  gate:
    name: release risk gate
    needs: [classify, desktop_core, preflight, package, android, apple, native_payload, pc_runtime_release_policy]
    if: always()
    runs-on: ubuntu-22.04
    env:
      CLASSIFY_RESULT: ${{ needs.classify.result }}
      NATIVE_VALIDATION_REQUIRED: ${{ needs.classify.outputs.native_validation }}
      NATIVE_VALIDATION_RESULT: ${{ needs.native_payload.result }}
      PC_RUNTIME_POLICY_RESULT: ${{ needs.pc_runtime_release_policy.result }}
      DESKTOP_CORE_REQUIRED: ${{ needs.classify.outputs.preflight }}
      DESKTOP_CORE_RESULT: ${{ needs.desktop_core.result }}
      PREFLIGHT_REQUIRED: ${{ needs.classify.outputs.preflight }}
      PREFLIGHT_RESULT: ${{ needs.preflight.result }}
      PACKAGE_REQUIRED: ${{ needs.classify.outputs.has_package }}
      PACKAGE_RESULT: ${{ needs.package.result }}
      ANDROID_REQUIRED: ${{ needs.classify.outputs.android }}
      ANDROID_RESULT: ${{ needs.android.result }}
      APPLE_REQUIRED: ${{ needs.classify.outputs.apple }}
      APPLE_RESULT: ${{ needs.apple.result }}
      APPLE_DEFERRED: ${{ github.event_name == 'workflow_dispatch' && inputs.defer_apple && 'true' || 'false' }}
      UNREGISTERED: ${{ needs.classify.outputs.unregistered }}
    steps:
      - name: Require every selected release-risk leg
        shell: bash
        run: |
          set -euo pipefail
          if [ "${APPLE_DEFERRED:-false}" = true ]; then
            echo '::warning::APPLE_VALIDATION=NOT_VALIDATED; explicit temporary deferral, no Apple workflow/artifact import or publication'
            printf '%s\n' 'Apple: **NOT_VALIDATED** (explicit temporary deferral).' 'Non-Apple checks still run; this is not complete candidate acceptance or publication clearance.' >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi
          [ "$CLASSIFY_RESULT" = success ] || {
            echo "::error::影响分类失败：$CLASSIFY_RESULT"; exit 1; }
          [ "$PC_RUNTIME_POLICY_RESULT" = success ] || {
            echo "::error::PC runtime 发布阻断策略未通过：$PC_RUNTIME_POLICY_RESULT"; exit 1; }
          if [ "$NATIVE_VALIDATION_REQUIRED" = true ]; then
            [ "$DESKTOP_CORE_RESULT" = success ] && [ "$NATIVE_VALIDATION_RESULT" = success ] || {
              echo '::error::native source/actual final payload proof did not pass'; exit 1; }
          fi
          # 未登记的影响面（落在 crates/ 或 src-tauri/ 内、两张登记表都查不到的 scope）当场红并点名。
          # 为什么这条门开在这里，而不是只靠 ui.yml 的 vitest 完备性门：
          #   1) 独立性 —— ui.yml 挂了、被 skip、或 required check 集合被改，那条门就没牙；
          #      本 job 是 release risk 的 required check，且 `if: always()`，任何情况下都会执行到这一行。
          #   2) 惩罚强度 —— 分类器对未登记 scope 已 fail-closed 成「内核门 + 四平台」，
          #      即默认多花一次全量打包的钱，但 CI 仍是绿的，没人会去补登记。
          #      这里把它升级成「当场红 + 点名 scope」，让补登记成为合入的前置条件。
          [ -z "$UNREGISTERED" ] || {
            echo "::error::未登记的影响面 scope：$UNREGISTERED"; exit 1; }
          if [ "$DESKTOP_CORE_REQUIRED" = true ] && [ "$DESKTOP_CORE_RESULT" != success ]; then
            echo "::error::四平台内核源码产物未通过：$DESKTOP_CORE_RESULT"
            exit 1
          fi
          if [ "$PREFLIGHT_REQUIRED" = true ] && [ "$PREFLIGHT_RESULT" != success ]; then
            echo "::error::发布预检未通过：$PREFLIGHT_RESULT"
            exit 1
          fi
          if [ "$PACKAGE_REQUIRED" = true ] && [ "$PACKAGE_RESULT" != success ]; then
            echo "::error::选中的安装包腿未全部通过：$PACKAGE_RESULT"
            exit 1
          fi
          # Android 腿与上面两条同形：被选中就必须 success，skipped/failure/cancelled 一律红。
          # 「没被选中」由分类器的登记表负责，而登记根内的未登记 scope 已 fail-closed 成 android=true。
          if [ "$ANDROID_REQUIRED" = true ] && [ "$ANDROID_RESULT" != success ]; then
            echo "::error::Android APK 腿未通过：$ANDROID_RESULT"
            exit 1
          fi
          if [ "${APPLE_DEFERRED:-false}" = true ]; then
            echo 'Non-Apple selected legs passed; Apple remains NOT_VALIDATED. Full release risk gate is not passed.'
            exit 1
          fi
          if [ "$APPLE_REQUIRED" = true ] && [ "$APPLE_RESULT" != success ]; then
            echo "::error::Apple App/PacketTunnel 腿未通过：$APPLE_RESULT"
            exit 1
          fi
          echo "发布风险门通过：desktop_core=$DESKTOP_CORE_RESULT preflight=$PREFLIGHT_RESULT package=$PACKAGE_RESULT android=$ANDROID_RESULT apple=$APPLE_RESULT"
