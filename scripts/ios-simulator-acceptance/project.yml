name: PolarisSimulatorAcceptance
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  PolarisUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PolarisUITests.swift]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.polaris.simulator-acceptance.tests
        GENERATE_INFOPLIST_FILE: true
        CODE_SIGNING_ALLOWED: false
        SWIFT_VERSION: "5.0"
schemes:
  PolarisSimulatorAcceptance:
    build:
      targets:
        PolarisUITests: all
    test:
      targets: [PolarisUITests]
