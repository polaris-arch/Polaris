[package]
name = "polaris-helper-proto"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
# Shared installation manifests need strict JSON, independently of the existing
# std-only line protocol codec. Both packages already exist in the workspace lockfile.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# Helper behavior ledger: source anchors and sha256, both already in the lockfile.
polaris-source-probe = { version = "1.0.0", path = "../source-probe" }
sha2 = "0.11"

[lib]
path = "src/lib.rs"
