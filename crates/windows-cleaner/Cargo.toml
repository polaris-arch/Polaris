[package]
name = "polaris-windows-cleaner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[target.'cfg(windows)'.dependencies]
# Existing workspace dependency; all privileged IO stays in one native module.
windows-sys = { version = "0.61", features = [
  "Win32_Foundation", "Win32_Security", "Win32_Security_Authorization",
  "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Services",
  "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_LibraryLoader",
  "Win32_System_Com", "Win32_System_Memory", "Win32_System_Registry", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging",
  "Wdk_Foundation", "Wdk_Storage_FileSystem",
] }

[[bin]]
name = "polaris-cleaner"
path = "src/main.rs"

[dev-dependencies]
tempfile = "3"
