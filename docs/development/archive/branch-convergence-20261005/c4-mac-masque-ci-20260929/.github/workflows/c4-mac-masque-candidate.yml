# REVIEW DRAFT ONLY. Copy to .github/workflows/c4-mac-masque-candidate.yml
# with the reviewed Python payload under .github/c4-mac-masque/ on one temporary
# c4-mac-masque-* branch commit. Do not merge this workflow to main.
name: C4 private Mac MASQUE candidate

on:
  push:
    branches:
      - 'c4-mac-masque-*'

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  candidate:
    runs-on: macos-14
    timeout-minutes: 90
    env:
      GOOS: darwin
      GOARCH: arm64
      CGO_ENABLED: '1'
      GOTOOLCHAIN: go1.26.8
      GOWORK: 'off'
      GOFLAGS: -mod=readonly
      GOPROXY: https://proxy.golang.org
      GOSUMDB: sum.golang.org
    steps:
      # Full action commits resolved from the v4/v6 refs on 2026-09-29.
      # Reviewer must recheck these identities before the one branch push.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.26.8'
          cache: false

      - name: Fix branch, source and toolchain identities
        shell: bash
        env:
          C4_SHA: ${{ github.sha }}
          C4_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          [[ "$C4_REF" =~ ^refs/heads/c4-mac-masque-[a-z0-9_-]+$ ]]
          [[ "$(git rev-parse HEAD)" == "$C4_SHA" ]]
          [[ "$(go version)" == go\ version\ go1.26.8\ darwin/arm64 ]]
          nonce="${C4_SHA:0:8}"
          {
            echo "C4_NONCE=$nonce"
            echo "C4_SOURCE=/var/tmp/polaris-mac-masque-source-$nonce"
            echo "C4_CANDIDATE=/var/tmp/polaris-mac-masque-fdtrace-$nonce"
          } >> "$GITHUB_ENV"

      - name: Fetch exact sing-box source and verified Go modules
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.8
          GOWORK: 'off'
        run: |
          set -euo pipefail
          umask 077
          test ! -e "$C4_SOURCE"
          test ! -L "$C4_SOURCE"
          git clone --depth 1 --branch v1.15.0-alpha.8 \
            https://github.com/SagerNet/sing-box.git "$C4_SOURCE"
          test "$(git -C "$C4_SOURCE" rev-parse HEAD)" = \
            b609f959f57ce34416c51c7b87ce4a76f2e1df56
          test -z "$(git -C "$C4_SOURCE" status --porcelain)"
          (cd "$C4_SOURCE" && go mod download && go mod verify)
          gopath="$(go env GOPATH)"
          echo "C4_QUIC=$gopath/pkg/mod/github.com/sagernet/quic-go@v0.61.0-sing-box-mod.7" >> "$GITHUB_ENV"
          echo "C4_SING_QUIC=$gopath/pkg/mod/github.com/sagernet/sing-quic@v0.7.1-0.20260924092235-4f371c86a365" >> "$GITHUB_ENV"

      - name: Build and check both full CGO1/naive candidates
        shell: bash
        env:
          GOTOOLCHAIN: go1.26.8
          GOWORK: 'off'
        run: |
          set -euo pipefail
          umask 077
          test -d "$C4_QUIC"
          test -d "$C4_SING_QUIC"
          python3 -m py_compile .github/c4-mac-masque/*.py
          python3 .github/c4-mac-masque/prepare.py \
            --source "$C4_SOURCE" --out "$C4_CANDIDATE" \
            --quic-reference "$C4_QUIC" \
            --sing-quic-reference "$C4_SING_QUIC"
          python3 .github/c4-mac-masque/ci_bundle.py pack \
            --nonce "$C4_NONCE" --quic-reference "$C4_QUIC" \
            --sing-quic-reference "$C4_SING_QUIC"

      - name: Attest both exact files
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: /var/tmp/polaris-mac-masque-ci-${{ env.C4_NONCE }}.*

      - name: Upload exact archive and detached receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: c4-mac-masque-${{ env.C4_NONCE }}
          path: |
            /var/tmp/polaris-mac-masque-ci-${{ env.C4_NONCE }}.tar
            /var/tmp/polaris-mac-masque-ci-${{ env.C4_NONCE }}.json
          if-no-files-found: error
          retention-days: 7
